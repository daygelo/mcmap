  <path d="M23 8 L41 14 L41 56 L23 50 Z" fill="#F4F4F5"/>
  <!-- Streets / campus grid -->
  <path d="M6 31 L23 26 L41 32 L58 27 M6 45 L23 40 L41 46 L58 41 M14 11 L14 53 M50 11 L50 53"
